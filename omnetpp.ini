[General]
ned-path = .;/home/vinicioskraus/vanet-workspace/veins-5.3.1/src;/home/vinicioskraus/vanet-workspace/inet-4.6.0/src
cmdenv-express-mode = false
cmdenv-autoflush = true
cmdenv-status-frequency = 1s
**.cmdenv-log-level = info

image-path = ../../images

network = RSUExampleScenario

##########################################################
#            Simulation parameters                       #
##########################################################
debug-on-errors = false
print-undisposed = true

sim-time-limit = 200s

**.scalar-recording = true
**.vector-recording = true

*.playgroundSizeX = 5000m
*.playgroundSizeY = 3300m
*.playgroundSizeZ = 50m


##########################################################
# Annotation parameters                                  #
##########################################################
*.annotations.draw = true

##########################################################
# Obstacle parameters                                    #
##########################################################
#*.obstacles.obstacles = xmldoc("config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']/obstacles")

##########################################################
#            TraCIScenarioManager parameters             #
##########################################################
*.manager.updateInterval = 0.1s
*.manager.class = "veins::TraCIScenarioManager"
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoStart = false
*.manager.autoShutdown = true
#*.manager.launchConfig = ""
#*.manager.launchConfig = xmldoc("sumo/tcc.launchd.xml")
*.manager.launchConfig = xmldoc("sumo/tcc_cenario_desvio.launchd.xml")
*.manager.trafficLightModuleType = "veins.nodes.TrafficLight"

# Coordenadas do semaforo que controla a conexao da route_tcc no mapa SUMO.
*.tls[*].mobility.x = 3576.52
*.tls[*].mobility.y = 2029.45
*.tls[*].mobility.z = 3

*.tls[*].applType = "veins.modules.application.traci.TraCIDemoTrafficLightApp"
*.tls[*].logicType = "veins.modules.world.traci.trafficLight.logics.TraCITrafficLightSimpleLogic"


##########################################################
#                       RSU SETTINGS                     #
#                                                        #
#                                                        #
##########################################################
# RSU ao lado do corredor da route_tcc, antes da intersecao controlada.
*.rsu[0].mobility.x = 3578.60
*.rsu[0].mobility.y = 2007.50
*.rsu[0].mobility.z = 3

*.rsu[*].applType = "TraCIDemoRSU11p"
*.rsu[*].appl.headerLength = 80 bit
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.dataOnSch = false
*.rsu[*].appl.beaconInterval = 1s
*.rsu[*].appl.beaconUserPriority = 7
*.rsu[*].appl.dataUserPriority = 5
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m

##########################################################
#            11p specific parameters                     #
#                                                        #
#                    NIC-Settings                        #
##########################################################
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false

*.**.nic.mac1609_4.useServiceChannel = false

*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.phy80211p.minPowerLevel = -110dBm

*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm

*.**.nic.phy80211p.decider = xmldoc("config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml", "//AnalogueModel[@type='SimplePathlossModel']")
*.**.nic.phy80211p.usePropagationDelay = true

*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")
*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m

##########################################################
#                      App Layer                         #
##########################################################
*.node[*].applType = "tcc.CongestionDetourApp"
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.sendBeacons = false
*.node[*].appl.dataOnSch = false
*.node[*].appl.beaconInterval = 1s

##########################################################
#                      Mobility                          #
##########################################################
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false
*.node[*0].veinsmobility.accidentCount = 1
*.node[*0].veinsmobility.accidentStart = 20s
*.node[*0].veinsmobility.accidentDuration = 20s

[Config Default]

[Config V2XValidation]
# Cenario de validacao de conectividade: V1/V2 anunciam BSMs
# periodicos no canal de controle. Os arquivos resultantes recebem o nome
# V2XValidation-#0 e preservam Default-#0.* para comparacao.
*.node[*].appl.sendBeacons = true
*.tls[*].appl.sendBeacons = false

[Config TrafficDetour]
description = "Fluxo congestionado com desvio V2X e sem acidente induzido"
extends = General
repeat = 1
seed-set = ${runnumber}
*.manager.launchConfig = xmldoc("sumo/tcc_cenario_desvio.launchd.xml")
*.manager.seed = ${seedset}
*.node[*].veinsmobility.accidentCount = 0
*.node[*].appl.enableV2X = true
*.node[*].appl.useVehicleTypeForV2X = true
sim-time-limit = 300s

[Config C1]
description = "Cenario C1 - 0% V2X entre carros"
extends = TrafficDetour
*.manager.launchConfig = xmldoc("sumo/tcc_cenario_desvio_C1.launchd.xml")
sim-time-limit = 20000s

[Config C2]
description = "Cenario C2 - 25% V2X entre carros"
extends = TrafficDetour
*.manager.launchConfig = xmldoc("sumo/tcc_cenario_desvio_C2.launchd.xml")
sim-time-limit = 20000s

[Config C3]
description = "Cenario C3 - 50% V2X entre carros"
extends = TrafficDetour
*.manager.launchConfig = xmldoc("sumo/tcc_cenario_desvio_C3.launchd.xml")
sim-time-limit = 20000s

[Config C4]
description = "Cenario C4 - 75% V2X entre carros"
extends = TrafficDetour
*.manager.launchConfig = xmldoc("sumo/tcc_cenario_desvio_C4.launchd.xml")
sim-time-limit = 20000s